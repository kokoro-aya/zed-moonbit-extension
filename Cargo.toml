[package]
name = "zed_moonbit_lab"
version = "0.3.1"
edition = "2021"
publish = false

[features]
default = []
dev-tools = [
    "dep:serde_json",
    "dep:tree-sitter",
    "dep:tree-sitter-moonbit",
    "dep:toml",
    "dep:url",
]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "query_audit"
path = "src/bin/query_audit.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mbt_lsp_probe"
path = "src/bin/mbt_lsp_probe.rs"
required-features = ["dev-tools"]

[dependencies]
serde_json = { version = "1.0", optional = true }
tree-sitter = { version = "0.26.8", optional = true }
tree-sitter-moonbit = { git = "https://github.com/moonbitlang/tree-sitter-moonbit", rev = "5435c307c6cf2ef0d508a99047b06f35a4308444", optional = true }
toml = { version = "0.9", optional = true }
url = { version = "2.5", optional = true }
zed_extension_api = "0.7.0"
